server {
    listen 127.0.0.1:8080 default_server;
    listen 127.0.0.1:8443 ssl default_server;
    server_name alpha.test;
    ssl_certificate /fixtures/tls/alpha-chain.pem;
    ssl_certificate_key /fixtures/tls/alpha-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        index index.html;
    }
    location /proxy/ {
        proxy_pass http://backend/;
    }
    location = /old {
        return 302 /hello.txt;
    }
}
server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8443 ssl;
    server_name beta.test;
    root /www/beta;
    ssl_certificate /fixtures/tls/beta-chain.pem;
    ssl_certificate_key /fixtures/tls/beta-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        index index.html;
    }
    location /proxy/ {
        proxy_pass http://backend/;
    }
}
